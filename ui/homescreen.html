<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monico Labs - Home</title>
<style>
  :root{--bg:#0b0b0d;--card:#16161a;--line:#26262c;--txt:#f2f2f2;--dim:#9a9aa3;--ok:#3ddc84;--off:#ff5a5a;--accent:#e8e8e8}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:22px 20px 6px} .brand{letter-spacing:.35em;font-weight:800;font-size:15px}
  .sub{color:var(--dim);margin-top:4px;font-size:13px}
  main{padding:14px 16px 40px;max-width:980px;margin:0 auto}
  h2{font-size:13px;letter-spacing:.25em;color:var(--dim);text-transform:uppercase;margin:22px 2px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:118px;text-decoration:none;color:var(--txt);display:block}
  .tile:active{transform:scale(.99)}
  .tile .name{font-size:19px;font-weight:700;margin:6px 0 2px}
  .tile .meta{color:var(--dim);font-size:13px;line-height:1.45}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
  .on{background:var(--ok)} .off{background:var(--off)}
  .big{font-size:26px} .tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--dim);margin:2px 3px 0 0}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:0 20px 28px}
  button{background:var(--accent);border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="brand">MONICO LABS</div>
  <div class="sub">Hosting homescreen. Your devices, your servers.</div>
</header>
<main>
  <h2>Connected devices</h2>
  <div class="grid" id="devices"><div class="tile"><div class="meta">Loading devices...</div></div></div>

  <h2>Hosted here</h2>
  <div class="grid" id="hosted"><div class="tile"><div class="meta">Loading...</div></div></div>

  <h2>Models</h2>
  <div class="grid" id="models"><div class="tile"><div class="meta">Loading...</div></div></div>

  <p style="margin-top:26px"><button onclick="load()">Refresh</button></p>
</main>
<footer>Monico Labs. Owner access only.</footer>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function hwLine(hw){if(!hw) return "";var bits=[];if(hw.device_model)bits.push(hw.device_model);if(hw.arch)bits.push(hw.arch);if(hw.cpu_cores)bits.push(hw.cpu_cores+" cores");if(hw.ram_total_gb)bits.push(hw.ram_total_gb+" GB RAM");if(hw.disk_free_gb)bits.push(hw.disk_free_gb+" GB free");return bits.join(" - ")}
async function load(){
  const r = await fetch("/api/devices"); const data = await r.json();
  const devs = data.devices || [];
  document.getElementById("devices").innerHTML = devs.map(d=>`
    <div class="tile">
      <span class="dot ${d.online?"on":"off"}"></span> <span class="meta">${d.online?"online":"offline"}</span>
      <div class="name">${esc(d.name)}</div>
      <div class="meta">${esc(d.role||"")}${d.via?`<br>via ${esc(d.via)}`:""}<br>${esc(hwLine(d.hw))}</div>
    </div>`).join("");
  document.getElementById("hosted").innerHTML = devs.flatMap(d=>{
    const items = d.hosted || [];
    const link = d.self ? "" : `/device/${d.device_id}/hosted/`;
    return items.map(h=>`<a class="tile" href="${link||"#"}">
      <div class="big">&#128230;</div><div class="name" style="font-size:16px">${esc(h)}</div>
      <div class="meta">on ${esc(d.name)}</div></a>`);
  }).join("") || '<div class="tile"><div class="meta">Nothing hosted yet</div></div>';
  document.getElementById("models").innerHTML = devs.map(d=>{
    const m = d.model || {};
    if(!m.installed) return `<div class="tile"><div class="big">&#129302;</div>
      <div class="name" style="font-size:16px">No local model</div>
      <div class="meta">on ${esc(d.name)}<br>Run <b>monico-model install</b> there to add one.</div></div>`;
    return `<div class="tile"><div class="big">&#129302;</div>
      <div class="name" style="font-size:16px">${esc(m.model||"model")}</div>
      <div class="meta">on ${esc(d.name)}<br>${esc(m.quant||"")} - ${esc(m.size_gb||"?")} GB<br>${esc(m.runner||"")}</div></div>`;
  }).join("");
}
load(); setInterval(load, 20000);
</script>
</body>
</html>
