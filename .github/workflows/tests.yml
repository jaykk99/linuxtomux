name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.7 needs an older runner image; setup-python still
          # publishes 3.7 builds for it. This is the repo's stated floor.
          - os: ubuntu-22.04
            python: "3.7"
          # Pin a stable Python release to avoid unintended previews.
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Interpreter
        run: python -V

      - name: Install pytest so no test modules are silently skipped
        run: |
          if [ "${{ matrix.python }}" = "3.7" ]; then
            python -m pip install "pytest<8"
          else
            python -m pip install pytest
          fi

      - name: Compile and run every test suite
        run: sh tests/run_all.sh

  smoke:
    name: Runtime smoke
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Start the bridge and exercise its endpoints
        run: python3 tests/smoke.py

  agent-mail-cohosting:
    name: Real Agent Mail + Lin-2-Mux on the same Ubuntu host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jaykk99/agent-mail-service
          path: agent-mail
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Start real local Agent Mail dashboard and mailbox MCP
        run: |
          mkdir -p "$RUNNER_TEMP/mail-state"
          chmod 700 "$RUNNER_TEMP/mail-state"
          bash agent-mail/start.sh --full up --install --state-dir "$RUNNER_TEMP/mail-state"
          bash agent-mail/start.sh --full status --state-dir "$RUNNER_TEMP/mail-state" > "$RUNNER_TEMP/mail-status.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads((Path(os.environ["RUNNER_TEMP"]) / "mail-status.json").read_text())
          assert status["phone_online_local"], status
          assert status["mcp_online_local"], status
          assert status["internal_network_usable"], status
          assert not status["public_internet_mail_verified"], status
          print("Real local Agent Mail services online: 8765 (dashboard) and 8787 (mail MCP)")
          PY

      - name: Start Lin-2-Mux on 8767, pair and execute from another process
        run: |
          python3 - <<'PY'
          import json, os, signal, socket, subprocess, sys, time
          from pathlib import Path
          root = Path.cwd()
          env = dict(os.environ)
          env["MONICO_HOME"] = str(Path(env["RUNNER_TEMP"]) / "cohost-bridge")
          for key in ("MONICO_PORT", "MONICO_SERVER", "MONICO_TOKEN"):
              env.pop(key, None)
          proc = subprocess.Popen([sys.executable, str(root / "monico-server"),
                                   "start", "--port", "8767"],
                                  env=env, stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL)
          try:
              deadline = time.monotonic() + 15
              while time.monotonic() < deadline:
                  assert proc.poll() is None, "Lin-2-Mux exited before binding"
                  try:
                      with socket.create_connection(("127.0.0.1", 8767), timeout=.5):
                          break
                  except OSError:
                      time.sleep(.1)
              else:
                  raise AssertionError("Lin-2-Mux failed to start on 8767")
              for port in (8765, 8787, 8767):
                  with socket.create_connection(("127.0.0.1", port), timeout=2):
                      pass
              with open(Path(env["MONICO_HOME"]) / "server-port.json") as f:
                  assert json.load(f)["port"] == 8767
              pair = subprocess.run([sys.executable, str(root / "monico-pair")],
                                    env=env, capture_output=True, text=True, timeout=10)
              assert pair.returncode == 0, pair.stderr
              assert "4-DIGIT CODE" in pair.stdout
              cmd = subprocess.run([sys.executable, str(root / "monico-cmd"),
                                    "linux", "printf real-cohost-ok"],
                                   env=env, capture_output=True, text=True, timeout=15)
              assert cmd.returncode == 0, cmd.stderr
              assert cmd.stdout == "real-cohost-ok", (cmd.stdout, cmd.stderr)
              print("PASS: real Agent Mail phone + MCP and Lin-2-Mux run concurrently; pair and remote command work on 8767")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=5)
          PY

      - name: Stop real local Agent Mail services
        if: always()
        run: bash agent-mail/start.sh --full stop --state-dir "$RUNNER_TEMP/mail-state" || true
